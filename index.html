<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tippi Coulter | Portfolio</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <main class="universe">

        <!-- Fixed horizontal orbit -->
        <div class="orbit-line"></div>


        <!-- Orbiting topics -->
        <div class="orbiting-object object-1">
            <a href="workshops.html" class="planet workshops">
                WORKSHOP<br>IDEAS
            </a>
        </div>

        <div class="orbiting-object object-2">
            <a href="digital.html" class="planet digital">
                DIGITAL<br>LITERACY
            </a>
        </div>

        <div class="orbiting-object object-3">
            <a href="stem.html" class="planet stem">
                STEM<br>PROJECTS
            </a>
        </div>

        <div class="orbiting-object object-4">
            <a href="about.html" class="planet about">
                ABOUT
            </a>
        </div>

        <div class="orbiting-object object-5">
            <a href="certificates.html" class="planet certificates">
                CERTIFICATES<br>&amp; COURSES
            </a>
        </div>


        <!-- You -->
        <div class="centre">

            <img src="me.png" alt="Your Name">

            <h1>Your Name</h1>

        </div>

    </main>


    <script>

        const objects = document.querySelectorAll(".orbiting-object");

        objects.forEach(object => {

            object.addEventListener("mouseenter", () => {
                objects.forEach(item => {
                    item.classList.add("paused");
                });
            });

            object.addEventListener("mouseleave", () => {
                objects.forEach(item => {
                    item.classList.remove("paused");
                });
            });

        });

    </script>

</body>

</html>
