<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masina "Tippi" Nina Coulter | Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="universe">

        <!-- The horizontal orbit -->
        <div class="orbit">

            <a href="about.html" class="planet about">
                ABOUT
            </a>

            <a href="digital.html" class="planet digital">
                DIGITAL<br>LITERACY
            </a>

            <a href="stem.html" class="planet stem">
                STEM<br>PROJECTS
            </a>

            <a href="workshops.html" class="planet workshops">
                WORKSHOP<br>IDEAS
            </a>

            <a href="certificates.html" class="planet certificates">
                CERTIFICATES<br>&amp; COURSES
            </a>

        </div>


        <!-- You in the centre -->
        <div class="centre">

            <img src="me.png" alt="Your Name">

            <h1>Your Name</h1>

        </div>

    </main>


    <script>

        const orbit = document.querySelector(".orbit");
        const planets = document.querySelectorAll(".planet");

        planets.forEach(planet => {

            planet.addEventListener("mouseenter", () => {
                orbit.classList.add("paused");
            });

            planet.addEventListener("mouseleave", () => {
                orbit.classList.remove("paused");
            });

        });

    </script>

</body>

</html>
